<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kinship">
  <!--
    The same monogram the sidebar and the hero card draw: a rounded square in
    the app's gradient with the initial of appTitle on it.

    Literal values rather than the CSS custom properties, because a favicon is
    a separate document that cannot see the page's variables. These are the
    light theme's hue-1 (terracotta) and hue-6, with radius-sm as a share of
    the square. Note that an XML comment may not contain a double hyphen, so
    the variables cannot be written here the way globals.css spells them.

    The letter is a path rather than text so it renders identically without
    depending on a font being available in the icon context.

    Both the gradient and the letter are frozen at build time: renaming the app
    in settings moves the sidebar monogram but not this.
  -->
  <defs>
    <linearGradient id="k" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bd5b3f"/>
      <stop offset="1" stop-color="#7a6a86"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#k)"/>

  <path
    d="M21 16 V48 M21 32 L40 16 M21 32 L43 48"
    fill="none"
    stroke="#fff"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
